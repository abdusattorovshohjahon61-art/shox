<!doctype html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEO Panel — Nilufar Shoes</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">

  <!-- KIRISH -->
  <section class="login-wrap" id="login">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="login-card">
      <div class="top-tools">
        <div class="lang-switch"><button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
        <button class="icon-btn" data-theme-toggle data-i18n-title="theme.toggle">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <div class="about-logo"><img src="assets/logo.png" alt="Nilufar Shoes"></div>
      <h2 data-i18n="ceo.title"></h2>
      <form class="form" id="loginForm">
        <label class="field"><span data-i18n="ceo.password"></span><input type="password" name="password" autocomplete="current-password" required></label>
        <p class="form-error" id="loginError"></p>
        <button class="btn btn-primary btn-block" data-i18n="ceo.login"></button>
        <small class="muted" data-i18n="ceo.hint"></small>
      </form>
      <p><a href="index.html" class="link-btn" data-i18n="ceo.toShop"></a></p>
    </div>
  </section>

  <!-- PANEL -->
  <div class="layout" id="app" hidden>
    <aside class="side">
      <a href="index.html" class="brand"><img src="assets/logo.png" class="logo-img" alt=""><span class="brand-text"><b>Nilufar</b><small>CEO</small></span></a>
      <button class="side-link" data-view="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg><span data-i18n="ceo.dashboard"></span></button>
      <button class="side-link" data-view="analytics"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg><span data-i18n="ceo.analytics"></span></button>
      <button class="side-link" data-view="products"><svg viewBox="0 0 24 24"><path d="M3 15c3 0 5-3 7-5l3 4c2 2 5 2 8 2v3H3z"/></svg><span data-i18n="ceo.products"></span></button>
      <button class="side-link" data-view="orders"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span data-i18n="ceo.orders"></span> <span class="pill" id="newOrdersPill"></span></button>
      <button class="side-link" data-view="content"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg><span data-i18n="ceo.content"></span></button>
      <button class="side-link" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="ceo.settings"></span></button>
      <div class="side-bottom">
        <a class="side-link" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="ceo.toShop"></span></a>
        <button class="side-link" id="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span data-i18n="ceo.logout"></span></button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-tools">
          <button class="icon-btn admin-burger" id="sideBurger" aria-label="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <h1 id="viewTitle"></h1>
        </div>
        <div class="topbar-tools">
          <div class="lang-switch"><button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
          <button class="icon-btn" data-theme-toggle data-i18n-title="theme.toggle">
            <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>

      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-analytics"></section>
      <section class="view" id="view-products"></section>
      <section class="view" id="view-orders"></section>
      <section class="view" id="view-content"></section>
      <section class="view" id="view-settings"></section>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- MAHSULOT FORMASI -->
  <div class="modal" id="productModal" aria-hidden="true">
    <div class="modal-box" style="width:min(720px,100%)">
      <button class="icon-btn modal-close" data-close data-i18n-title="close">✕</button>
      <h3 id="pfTitle"></h3>
      <form class="form" id="productForm"></form>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
